name: mirror-images

on:
  push:
    tags:
      - "v1.*"
  workflow_dispatch: {}

# Prevent concurrent mirroring
concurrency:
  group: mirror-images
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions: {}

jobs:
  mirror-images:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write # to write the mirrored images to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: build kubeone
        run: |
          make install
      - name: login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: mirror kubeone images
        run: |
          kubeone mirror-images ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
