    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/management-plane: PrismCentral
    app.kubernetes.io/name: nutanix-csi-storage
    app.kubernetes.io/topology-enabled: "true"
    app.kubernetes.io/version: 3.9.0
