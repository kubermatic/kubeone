apiVersion: v1
kind: ServiceAccount
metadata:
  labels:
    app: vsphere-cpi
    component: cloud-controller-manager
    vsphere-cpi-infra: service-account
  name: cloud-controller-manager
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app: vsphere-cpi
    component: cloud-controller-manager
    vsphere-cpi-infra: role
  name: cloud-controller-manager
rules:
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - nodes
    verbs:
      - '*'
  - apiGroups:
      - ""
    resources:
      - nodes/status
    verbs:
      - patch
  - apiGroups:
      - ""
    resources:
      - services
    verbs:
      - list
      - patch
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - services/status
    verbs:
      - patch
  - apiGroups:
      - ""
    resources:
      - serviceaccounts
    verbs:
      - create
      - get
      - list
      - watch
      - update
  - apiGroups:
      - ""
    resources:
      - persistentvolumes
    verbs:
      - get
      - list
      - update
      - watch
  - apiGroups:
      - ""
    resources:
      - endpoints
    verbs:
      - create
      - get
      - list
      - watch
      - update
  - apiGroups:
      - ""
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - coordination.k8s.io
    resources:
      - leases
    verbs:
      - create
      - get
      - list
      - watch
      - update
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  labels:
    app: vsphere-cpi
    component: cloud-controller-manager
    vsphere-cpi-infra: role-binding
  name: servicecatalog.k8s.io:apiserver-authentication-reader
  namespace: kube-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: cloud-controller-manager
    namespace: kube-system
  - apiGroup: ""
    kind: User
    name: cloud-controller-manager
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  labels:
    app: vsphere-cpi
    component: cloud-controller-manager
    vsphere-cpi-infra: cluster-role-binding
  name: cloud-controller-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cloud-controller-manager
subjects:
  - kind: ServiceAccount
    name: cloud-controller-manager
    namespace: kube-system
  - kind: User
    name: cloud-controller-manager
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  annotations:
    scheduler.alpha.kubernetes.io/critical-pod: ""
  labels:
    app: vsphere-cpi
    component: cloud-controller-manager
    tier: control-plane
    vsphere-cpi-infra: daemonset
  name: vsphere-cpi
  namespace: kube-system
spec:
  selector:
    matchLabels:
      app: vsphere-cpi
  template:
    metadata:
      annotations:
        kubeone.k8c.io/cabundle-hash: '{{ CABundle | sha256sum }}'
        kubeone.k8c.io/cloudconfig-hash: '{{ .Config.CloudProvider.CloudConfig | sha256sum }}'
      labels:
        app: vsphere-cpi
        component: cloud-controller-manager
        release: vsphere-cpi
        tier: control-plane
        vsphere-cpi-infra: daemonset
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: Exists
      containers:
        - args:
            - --cloud-provider=vsphere
            - --v=2
            - --cloud-config=/etc/cloud/cloud-config
            - --concurrent-service-syncs={{ default 1 .Params.CCM_CONCURRENT_SERVICE_SYNCS }}
          env:
            - name: ENABLE_ALPHA_DUAL_STACK
              value: '{{ .Config.ClusterNetwork.IPFamily.IsDualstack }}'
          image: '{{ .InternalImages.Get "VsphereCCM" }}'
          imagePullPolicy: IfNotPresent
          name: vsphere-cpi
          volumeMounts:
            - mountPath: /etc/cloud
              name: vsphere-config-volume
              readOnly: true
      dnsPolicy: ClusterFirst
      hostNetwork: true
      priorityClassName: system-node-critical
      securityContext:
        fsGroup: 1001
        runAsUser: 1001
      serviceAccountName: cloud-controller-manager
      tolerations:
        - effect: NoSchedule
          key: node.cloudprovider.kubernetes.io/uninitialized
          value: "true"
        - effect: NoSchedule
          key: node-role.kubernetes.io/control-plane
          operator: Exists
        - effect: NoSchedule
          key: node.kubernetes.io/not-ready
          operator: Exists
        - effect: NoExecute
          key: CriticalAddonsOnly
          operator: Exists
      volumes:
        - name: vsphere-config-volume
          secret:
            secretName: cloud-config
  updateStrategy:
    type: RollingUpdate
