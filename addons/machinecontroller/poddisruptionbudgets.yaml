{{- /* On KubeVirt, machine-controller runs in the infra cluster, see pkg/cloudprovider/kubevirt/machinecontroller */}}
{{ if not .Config.CloudProvider.Kubevirt }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: machine-controller
  namespace: kube-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: machine-controller
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: machine-controller-webhook
  namespace: kube-system
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: machine-controller-webhook
{{ end }}
