apiVersion: v1
kind: ServiceAccount
metadata:
  name: etcd-defrag
  namespace: kube-system
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: etcd-defrag
  namespace: kube-system
spec:
  # Run weekly — every Sunday at 01:00 UTC (configurable via SCHEDULE param)
  schedule: {{ default "0 1 * * 0" .Params.SCHEDULE | quote }}
  concurrencyPolicy: Forbid
  failedJobsHistoryLimit: 3
  successfulJobsHistoryLimit: 5
  suspend: false
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: etcd-defrag
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          nodeSelector:
            node-role.kubernetes.io/control-plane: ""
          tolerations:
          - key: node-role.kubernetes.io/control-plane
            effect: NoSchedule
            operator: Exists
          restartPolicy: OnFailure
          volumes:
          - name: host-pki
            hostPath:
              path: /etc/kubernetes/pki
          containers:
          - name: etcd-defrag
            image: '{{ .InternalImages.Get "BackupResticSnapshotter" }}'
            imagePullPolicy: IfNotPresent
            command:
              - etcdctl
            args:
              - defrag
              - --cluster
            env:
            - name: ETCDCTL_API
              value: "3"
            - name: ETCDCTL_DIAL_TIMEOUT
              value: {{ default "30s" .Params.DIAL_TIMEOUT | quote }}
            - name: ETCDCTL_CACERT
              value: /etc/kubernetes/pki/etcd/ca.crt
            - name: ETCDCTL_CERT
              value: /etc/kubernetes/pki/etcd/healthcheck-client.crt
            - name: ETCDCTL_KEY
              value: /etc/kubernetes/pki/etcd/healthcheck-client.key
            - name: ETCDCTL_ENDPOINTS
              value: {{ default "https://127.0.0.1:2379" .Params.ENDPOINTS | quote }}
            volumeMounts:
            - mountPath: /etc/kubernetes/pki
              name: host-pki
              readOnly: true
            resources:
              requests:
                cpu: 100m
                memory: 64Mi
              limits:
                cpu: 500m
                memory: 128Mi
